# yaml-language-server: $schema=https://storage.googleapis.com/coderabbit_public_assets/schema.v2.json
language: en-US

tone_instructions: >
  This is a WordPress plugin (PHP 8.2+, MariaDB 11.7+) implemented
  test-driven (see AGENTS.md). Favor WordPress coding conventions
  (escaping, sanitization, nonces/capabilities) and flag any production
  code added without a corresponding test.

early_access: false

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    - "!**/vendor/**"
    - "!**/node_modules/**"
    - "!**/build/**"
    - "!**/*.min.js"
  path_instructions:
    - path: "includes/**/*.php"
      instructions: >
        Follow WordPress Coding Standards (WPCS). Check escaping
        (esc_html, esc_attr, esc_sql), output/input sanitization,
        capability checks, and nonce verification. $wpdb queries must
        use prepare() or %s/%d placeholders; never interpolate raw
        floats into SQL (see VECTOR column notes in AGENTS.md — must
        use number_format() with VEC_FromText(), not %f).
    - path: "tests/phpunit/unit/**/*.php"
      instructions: >
        These are pure-PHP unit tests with no WordPress dependency.
        Flag any usage of WordPress functions or $wpdb here.
    - path: "tests/phpunit/integration/**/*.php"
      instructions: >
        These run against a real MariaDB via wp-env. The AI Connector
        must be stubbed via dependency injection — flag any real network
        calls or live LLM usage.
    - path: "**/*.md"
      instructions: "Check for clarity, accuracy, and consistency with AGENTS.md."

chat:
  auto_reply: true

knowledge_base:
  opt_out: false
